<!DOCTYPE html>
<html>
    <head>
        <title>Tone Detector</title>
        <style>
            body {
              display: flex;            /* Enables Flexbox */
              justify-content: center;  /* Centers horizontally */
              align-items: center;      /* Centers vertically */
              min-height: 100vh;            /* Sets height to full viewport height */
              margin: 0;                /* Removes default browser margins */
              padding:20px;              /* Adds padding around content */
              flex-direction: column;   /* Aligns items in column */
            }
            select.custom-shape {
              border-radius: 10px; /* Rounded corners */
              border: 2px solid #484848; /* Custom border */
              padding: 5px 10px; /* Custom padding for size */
              /*width: 100px; /* Custom width */
              background-color: #f9f9f9; /* Custom background color */
              cursor: pointer; /* Changes cursor to pointer on hover */
    
            }
            textarea.custom-shape {
              border-radius: 10px; /* Rounded corners */
              border: 2px solid #484848; /* Custom border */
              padding: 10px; /* Custom padding for size */
              width: 400px; /* Custom width */
              height:400px; /* Custom height */
              background-color: #f9f9f9; /* Custom background color */
              
           }
           button.custom-shape {
              border-radius: 10px; /* Rounded corners */
              border: 2px solid #484848; /* Custom border */
              padding: 5px 10px; /* Custom padding for size */
              /*width: 150px; /* Custom width */
              background-color: #f9f9f9; /* Custom background color */
              cursor: pointer; /* Changes cursor to pointer on hover */
              transition: background-color 0.2s ease; /* Smooth transition for background color */
            }
            button.custom-shape:active {
              background-color: #d3d3d3; /* Change background color when clicked */
           }
    
           #title-header{
            font-family: 'Times New Roman';
            /*font-size:*/
           }
    
           #screen1{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
           }
    
           #screen2{
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 8px;
           }
    
           #result{
            background-color: #f9f9f9; /* Custom background color */
            border-radius: 10px; /* Rounded corners */
            border: 2px solid #484848; /* Custom border */
            display: none; /* Hide by default */
            padding: 20px; /* Custom padding */
           }
    
           #loading{
            display:none;
            font-size: 18px;
            color: white;
           }
    
          </style>
    </head>

    <body style="background-color:rgb(153, 125, 164);"></Bodystyle>  
        <div id="screen1">
            <h1 id="title-header">Tone Detector</h1>
            <textarea class="custom-shape" id="text"  placeholder="Insert email here: "></textarea>

            <select class="custom-shape" id="recipient" style="margin-top: 5px">
                <option value = "friend">Friend</option>
                <option value = "boss">Boss</option>
                <option value = "coworker">CoWorker</option>
                <option value = "subordinate">Subordinate</option>
            </select>

            <select class="custom-shape" id="goal" style="margin-top: 5px">
                <option value="get a response">Get a Response</option>
                <option value="set a boundary">Set a Boundary</option>
                <option value="ask for something">Ask for Something</option>
                <option value="de-escalate tension">De-escalate Tension</option>
                <option value="negotiate">Negotiate</option>
            </select>

            <button class="custom-shape" onclick="analyze()" style="margin-top: 5px">Analyze Tone</button>
        </div>

        <div id="loading">Analyzing... ⏳</div>
        
        <div class="result" id="screen2">
            <h1>Your Results</h1>
            <div id="result">
                <h2> Overall Tone: <span id="tone"></span></h2>
                <h2>Friendliness Score: <span id="score"></span>/10</h2>
                <p id="summary"></p>
                <div id="flagged"></div>
                <div id="suggestions"></div>
            </div>
            <button class="custom-shape" onclick="goBack()">⬅ Analyze Another</button>
        </div>
    </body>

    <script>
    async function analyze(){
        const text = document.getElementById("text").value;
        if (!text.trim()) {
            alert("Please enter some text to first.");
            return;
        }

         // Show loading message

        const recipient = document.getElementById("recipient").value;
        const goal = document.getElementById("goal").value;

        document.getElementById("screen1").style.display = "none";
        document.getElementById("loading").style.display = "block";

        const response = await fetch("/analyze", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({text, recipient, goal})
        });
        const data = await response.json();

        document.getElementById("tone").textContent = data.overallTone;
        document.getElementById("score").textContent = data.score;
        document.getElementById("summary").textContent = data.summary;
        document.getElementById("result").style.display = "block";

        document.getElementById("loading").style.display = "none";
        document.getElementById("screen2").style.display = "flex";



        //Flagged phrases
        let flaggedHTML = "<h3>Flagged Phrases:</h3>";
        data.flaggedPhrases.forEach(item=> {
            flaggedHTML += `<p><strong>"${item.phrase}"</strong> - ${item.reason}</p>`;
        });
        document.getElementById("flagged").innerHTML = flaggedHTML;

        let suggestionsHTML = "<h3>Suggestions:</h3>";
        data.suggestions.forEach(item => {
            suggestionsHTML += `
                <p>❌ <del>${item.original}</del></p>
                <p>✅ ${item.rewrite}</p>
            `;
        });
        document.getElementById("suggestions").innerHTML = suggestionsHTML;
    }

    function goBack() {
            document.getElementById("screen2").style.display = "none";
            document.getElementById("loading").style.display = "none";
            document.getElementById("screen1").style.display = "flex";

            // Clear the form
            document.getElementById("text").value = "";
            document.getElementById("recipient").selectedIndex = 0;
            document.getElementById("goal").selectedIndex = 0;
        }
    </script>
</html>
